<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · one person</title>
<style>
  :root { --bg: #f4f4f1; --panel: #ffffff; --ink: #1c1c1a; --quiet: #6b6b66; --line: #e2e1dc; --accent: #2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --quiet: #9a9a94; --line: #33332f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  button, input { font: inherit; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .top h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .top h1 small { color: var(--quiet); font-weight: 400; }
  .spacer { flex: 1; }
  label { display: flex; align-items: center; gap: 6px; color: var(--quiet); }
  input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 160px; }
  .ghost { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
  .ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 400px); justify-content: center; gap: 16px; padding: 16px; height: calc(100vh - 58px); }
  @media (max-width: 820px) { main { grid-auto-flow: row; grid-auto-columns: auto; height: auto; } .device { height: 640px; } }
  .device { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .device h2 { margin: 0; font-size: 12px; font-weight: 500; color: var(--quiet); text-align: center; }
  iframe { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 28px; background: var(--panel); min-height: 0; }
  .note { padding: 24px; text-align: center; color: var(--quiet); }
</style>
</head>
<body>
<div class="top">
  <h1>{{title}} <small>· one person on every channel</small></h1>
  <div class="spacer"></div>
  <label>Test number <input id="person" autocomplete="off" spellcheck="false" aria-label="Test number"></label>
  <button class="ghost" id="fresh" type="button" title="A new test number: a new person, starting from nothing">New person</button>
  <button class="ghost" id="debug" type="button" aria-pressed="false" title="Show the agent's tool calls in each conversation">Debug</button>
</div>
<main id="devices"></main>
<script>
  // Where the simulators are mounted ("" on their own port).
  const BASE = "{{base}}";
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const newNumber = () => "+1555" + String(Math.floor(Math.random() * 1e7)).padStart(7, "0");

  let person = params.get("person") || recall("parley.person") || newNumber();
  let debug = recall("parley.debug") === "1";
  let own = [];

  function draw() {
    remember("parley.person", person);
    $("person").value = person;
    $("debug").setAttribute("aria-pressed", String(debug));
    const devices = $("devices");
    devices.innerHTML = "";
    if (!own.length) {
      devices.innerHTML = "<div class='note'>This agent has no channels of its own for the simulators to play.</div>";
      return;
    }
    for (const o of own) {
      const device = document.createElement("section");
      device.className = "device";
      const h = document.createElement("h2");
      h.textContent = o.channel;
      const frame = document.createElement("iframe");
      frame.title = o.channel;
      frame.src = `${BASE}/?platform=${o.platform}&person=${encodeURIComponent(person)}&embed=1&debug=${debug ? 1 : 0}`;
      device.append(h, frame);
      devices.appendChild(device);
    }
  }

  $("person").addEventListener("change", () => { const v = $("person").value.trim(); if (v) { person = v; draw(); } });
  $("fresh").addEventListener("click", () => { person = newNumber(); draw(); });
  $("debug").addEventListener("click", () => { debug = !debug; remember("parley.debug", debug ? "1" : "0"); draw(); });

  (async () => {
    ({ own } = await (await fetch(`${BASE}/api/platforms?person=${encodeURIComponent(person)}`)).json());
    draw();
  })();
</script>
</body>
</html>
